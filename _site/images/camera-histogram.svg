<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="10" height="10" style="color:white" aria-hidden="true">
  <!-- viewfinder corner brackets -->
  <g fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1.5,7.5 V1.5 H7.5" />
    <path d="M32.5,1.5 H38.5 V7.5" />
    <path d="M1.5,32.5 V38.5 H7.5" />
    <path d="M38.5,32.5 V38.5 H32.5" />
  </g>

  <!-- extremely underexposed histogram curve: nearly all data slammed -->
  <!-- against the left (black) wall, essentially nothing beyond it -->
  <g>
    <path
      d="M5,32 L5,7 C6,7 7,14 7.8,19 C8.5,24 10,29 12,31 C15,31.85 25,32.05 35,32.1 L35,32 Z"
      fill="white"
      fill-opacity="0.85"
    />
    <!-- baseline -->
    <line x1="5" y1="32" x2="35" y2="32" stroke="white" stroke-width="0.75" stroke-opacity="0.5" />
    <!-- clipped edge marker, showing data slammed against pure black -->
    <line x1="5" y1="7" x2="5" y2="32" stroke="white" stroke-width="1.6" stroke-linecap="round" />
  </g>
</svg>
